# Configuración principal del plugin Heartless
# Los valores aquí se recargan automáticamente al usar /heartless reload


# Configuración de Base de Datos
database:
  enabled: true  # true para usar base de datos, false para usar almacenamiento JSON
  type: "sqlite"  # Tipo de base de datos: "mysql", "sqlite"
  
  # Configuración para MySQL/MariaDB
  mysql:
    host: "localhost"
    port: 3306
    database: "heartless_db"
    username: "heartless_user"
    password: "your_password_here"
  
  # Configuración para SQLite
  sqlite:
    file: "heartless.db"  # Nombre del archivo de base de datos SQLite
    
  # Configuración del pool de conexiones HikariCP
  pool:
    size: 10  # Número máximo de conexiones en el pool
    connection-timeout: 30000  # Timeout de conexión en milisegundos (30 segundos)
    idle-timeout: 600000  # Tiempo antes de cerrar conexiones inactivas (10 minutos)
    max-lifetime: 1800000  # Tiempo máximo de vida de una conexión (30 minutos)
    
  # Configuración de tablas
  tables:
    prefix: "heartless_"  # Prefijo para todas las tablas

# Configuración de eventos semanales
events:
  enabled: true
  auto-start: true
  save-interval: 300  # segundos
  max-concurrent-events: 1
  notification-radius: 100
  exclude-worlds:
    - "world_nether"
    - "world_the_end"
  
# Configuración del sistema de salud
health:
  default-max-health: 20.0
  minimum-health: 6.0
  health-steal-enabled: true
  health-rewards-enabled: true
  # Configuración por mundos para el sistema de robo de corazones
  health-steal-worlds:
    # Selección múltiple de mundos donde estará activo el sistema
    # Nota: En la primera carga, si esta lista está vacía, se inicializará automáticamente
    # con los mundos disponibles actualmente y se guardará en el config.
    selected:
      - "world"
    # Activación por mundo (toggle). Si no se especifica, por defecto se activa para los mundos seleccionados
    enabled-by-world:
      world: true
  
# Configuración del sistema de baneo
ban-system:
  enabled: true
  default-duration: 3600  # segundos (1 hora)
  broadcast-bans: true
  
# Configuración de efectos personalizados
custom-effects:
  enabled: true
  zombie-infection:
    enabled: true
    duration: 600  # segundos
    spread-chance: 0.15
    cure-villagers-required: 1

# Configuración de control de mobs
mob-control:
  enabled: true
  # Intervalo de chequeo para limpieza de mobs (en ticks)
  check-interval: 600 # 30 segundos
  
  # Límites de spawn personalizados para eventos
  spawn-limits:
    # Máximo de mobs hostiles por jugador en radio de carga
    hostile-per-player: 25
    # Radio mínimo de spawn desde el jugador (bloques)
    min-spawn-radius: 24
    # Radio máximo de spawn desde el jugador (bloques)
    max-spawn-radius: 48
    # Distancia mínima entre mobs spawneados por el plugin
    min-distance-between-mobs: 5
    
  # Configuración de limpieza
  cleanup:
    enabled: true
    # Eliminar mobs hostiles que no tienen objetivo y están lejos
    remove-inactive: true
    # Tiempo de inactividad antes de eliminar (segundos)
    inactive-time: 45
    # Radio de limpieza (mobs más allá de este radio del jugador más cercano serán eliminados)
    cleanup-radius: 64
    # No eliminar mobs con nombre personalizado
    protect-named-mobs: true
    
# Configuración de mensajes
messages:
  prefix: "<gray>[ <gradient:#ffc329:#ffb029:#ff9c29:#ff8929:#ff7629:#ff6329:#ff5029:#ff3c29:#ff2929>Heartless</gradient> ]</gray>"
  reload-success: "<green>Plugin recargado exitosamente!</green>"
  reload-error: "<red>Error al recargar el plugin.</red>"
  
  # Configuración de mensajes de difusión para completación de desafíos
  challenge-completion:
    enabled: true
    format: "<gradient:#FFD700:#FFA500><bold>🏆 DESAFÍO COMPLETADO 🏆</bold></gradient>\n<white>El jugador <yellow><bold>{player}</bold></yellow> ha completado el desafío</white>\n<gold><bold>\"{challenge}\"</bold></gold> <white>en</white> <aqua><bold>{event}</bold></aqua><white>!</white>"
    console-log: true
  
# Configuración de optimización
optimization:
  task-optimizer-enabled: true
  max-threads: 4
  queue-size: 1000
  
# Configuración del sistema de bonificación por permisos
reward-bonus:
  enabled: true
  permissions:
    htl.bonus.5: 5     # 5% de bonificación
    htl.bonus.10: 10  # 10% de bonificación
    htl.bonus.20: 20     # 20% de bonificación

# Configuración de debug
debug:
  enabled: false
  log-level: "INFO"
  verbose-events: false
