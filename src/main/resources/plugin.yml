name: Heartless
version: 1.0.0
main: com.darkbladedev.HeartlessMain
description: "Adds a customizable and funny events system to your Minecraft server."
authors: [DarkBladeDev]
prefix: Heartless
api-version: 1.21
load: STARTUP
depend: [PlaceholderAPI]
softdepend: [WorldGuard, WorldEdit]

# Plugin Commands
commands:
  heartless:
    description: "Main commands."
    aliases: [hs]
    permission: htl.access
    permission-message: "You do not have permission to use this command."

# Permissions Statement
permissions:
  # Main Permissions
  htl.access:
    description: "Allows to use Heartless core commands."
    default: op
  htl.reload:
    description: "Allows to reload Heartless plugin."
    default: op
  htl.diagnostic:
    description: "Allows to use diagnostic commands for system troubleshooting."
    default: op

  # Command Permissions
  htl.command.health:
    description: "Allows to use /heartless health command."
    default: op
  htl.command.effects.zombieinfection:
    description: "Allows to use /heartless effects zombieinfection command."
    default: op
  htl.command.curemanagement:
    description: "Permite gestionar la cantidad de curas de infección zombie de los jugadores."
    default: op
  htl.admin.zombieinfection:
    description: "Permite administrar el sistema de infección zombie."
    default: op
  htl.admin.autosave:
    description: "Permite administrar el sistema de guardado automático."
    default: op
  htl.admin.bonus:
    description: "Permite administrar el sistema de bonificaciones por permisos."
    default: op
    
  # Permisos de bonificación
  htl.bonus.5:
    description: "Otorga un 5% de bonificación en recompensas de desafíos."
    default: false
  htl.bonus.10:
    description: "Otorga un 10% de bonificación en recompensas de desafíos."
    default: false
  htl.bonus.20:
    description: "Otorga un 20% de bonificación en recompensas de desafíos."
    default: false

    
  htl.bansystem.unban:
    description: Permite desbanear jugadores
    default: op
  htl.bansystem.list:
    description: Permite listar jugadores baneados
    default: op
  

  htl.events.pause:
    description: Permite pausar eventos
    default: op
  htl.events.resume:
    description: Permite pausar eventos
    default: op
  htl.events.start:
    description: Permite iniciar eventos
    default: op
  htl.events.stop:
    description: Permite detener eventos
    default: op
  htl.challenges:
    description: Permite ver desafíos
    default: op
    
  # Ban Duration Permissions
  htl.ban.duration.exempt:
    description: Exime al jugador de ser baneado al llegar al minimo de corazones
    default: false
  htl.ban.duration.1:
    description: Establece la duracion del baneo a 1 hora
    default: false
  htl.ban.duration.2:
    description: Establece la duracion del baneo a 2 horas
    default: false
  htl.ban.duration.3:
    description: Establece la duracion del baneo a 3 horas
    default: false
  htl.ban.duration.4:
    description: Establece la duracion del baneo a 4 horas
    default: false
  htl.ban.duration.6:
    description: Establece la duracion del baneo a 6 horas
    default: false
  htl.ban.duration.12:
    description: Establece la duracion del baneo a 12 horas
    default: false
  htl.ban.duration.24:
    description: Establece la duracion del baneo a 24 horas
    default: false